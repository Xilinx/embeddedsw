%YAML 1.2
---
title: Bindings for freertos bsp

maintainers:
  - Appana Durga Kedareswara Rao <appanad.durga.rao@xilinx.com>

type: os

version: 1.14

supported_processors:
  - psx_cortexa78
  - psv_cortexa72
  - psu_cortexa53
  - ps7_cortexa9
  - psx_cortexr52
  - psv_cortexr5
  - psu_cortexr5
  - microblaze

properties:
  reg:
    description: Physical base address and size of the controller register map

depends_libs:
    xiltimer: {}

depends:
    ttcps:
        - reg
        - interrupts
    tmrctr:
        - reg
        - interrupts
    scugic:
        - reg
    intc:
        - reg
    uartps:
        - reg
    uartpsv:
        - reg
    uartlite:
        - reg
    uartns550:
        - reg
    coresightps_dcc:
        - reg
    iomodule:
        - reg
...
