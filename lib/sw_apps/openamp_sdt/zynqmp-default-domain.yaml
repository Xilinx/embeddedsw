reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2

  rproc0@9800000:
    label: rproc0
    start: 0x9800000
    # RPU0 firmware window 0x9800000-0x987ffff, up to the vrings. The
    # Vitis FreeRTOS OpenAMP demo keeps .text and .bss in DDR and needs
    # more than 0x20000.
    size: 0x80000
    no-map: 1
  vdev0vring0@9880000:
    label: vdev0vring0
    start: 0x9880000
    size: 0x4000
    no-map: 1
  vdev0vring1@9884000:
    label: vdev0vring1
    start: 0x9884000
    size: 0x4000
    no-map: 1
  vdev0buffer@9888000:
    label: vdev0buffer
    start: 0x9888000
    size: 0x78000
    no-map: 1
  libmetal_elf@9968000:
    label: libmetal_elf
    start: 0x9968000
    size: 0x60000
    no-map: 1
  libmetal_desc0@99c8000:
    label: libmetal_desc0
    start: 0x99c8000
    size: 0x4000
    no-map: 1
  libmetal_desc1@99cc000:
    label: libmetal_desc1
    start: 0x99cc000
    size: 0x4000
    no-map: 1
  libmetal_data@99d0000:
    label: libmetal_data
    start: 0x99d0000
    size: 0x40000
    no-map: 1

axi:
  # TTC3 belongs to RPU0 (rpmsg relation timer: ttc3). Build the RPU0
  # BSP with XILTIMER_sleep_timer = *_ttc_9 and XILTIMER_tick_timer =
  # *_ttc_10 (TTC3 counters 0 and 1). Applied only when the Linux domain
  # is activated (domain_access -t /domains/APU_Linux).
  timer@ff140000:
    status!linux: "disabled"

  libmetal_uio_desc0@99c8000:
    linux,uio-name: "libmetal-desc0"
    start: 0x99c8000
    size: 0x4000
    compatible: "uio"
  libmetal_uio_desc1@99cc000:
    linux,uio-name: "libmetal-desc1"
    start: 0x99cc000
    size: 0x4000
    compatible: "uio"
  libmetal_uio_data@99d0000:
    linux,uio-name: "libmetal-data"
    start: 0x99d0000
    size: 0x40000
    compatible: "uio"

  timer@ff130000:
    compatible: "uio"
    linux,uio-name: "libmetal-timer"
  # linux -> rpu1 libmetal IPI
  ipi@ff350000:
    compatible: "uio"
    linux,uio-name: "libmetal-ipi"

domains:
  APU_Linux: # host in channel from a53-0
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_a53
        cpumask: 0xf
        mode:
          secure: true
          el: 0x3
    os,type: linux
    # Linux keeps every device; the !linux overrides above still apply.
    access:
      - dev: "*"
      - dev: timer@ff130000
      - dev: ipi@ff340000
      - dev: ipi@ff350000
      - dev: libmetal_uio_desc0@99c8000
      - dev: libmetal_uio_desc1@99cc000
      - dev: libmetal_uio_data@99d0000
    memory:
      - "*"
    reserved-memory:
      - vdev0buffer@9888000
      - vdev0vring1@9884000
      - vdev0vring0@9880000
      - rproc0@9800000
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      remoteproc-relation:
        compatible: openamp,remoteproc-v2
        relation0:
          remote: R5_0_FREERTOS
          # SDT labels; node names use "_" or "-" depending on the SDT.
          elfload: [ psu_r5_0_atcm_global, psu_r5_0_btcm_global, rproc0@9800000 ]

      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          remote: R5_0_FREERTOS
          carveouts: [ vdev0vring0@9880000, vdev0vring1@9884000, vdev0buffer@9888000 ]
          mbox: ipi_7_to_ipi_1
          timer: [ ttc0, ttc1 ]

      libmetal-relation:
        compatible: libmetal,ipc-v1
        relation0:
          remote: R5_1_BAREMETAL
          carveouts: [ libmetal_uio_desc0@99c8000, libmetal_uio_desc1@99cc000, libmetal_uio_data@99d0000 ]
          mbox: ipi_8_to_ipi_2
          timer: ttc2

  R5_0_FREERTOS:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_r5_0
        cpumask: 0x1
        mode:
          secure: true
          el: 0x3
    os,type: freertos
    sram:
      - dev: rproc0@9800000
        start: 0x9800000
        size: 0x80000
      - dev: psu_r5_0_atcm_global@ffe00000
        size: 64K
        start: 0xffe00000
      - dev: psu_r5_0_btcm_global@ffe20000
        size: 64K
        start: 0xffe20000
    reserved-memory:
      - vdev0buffer@9888000
      - vdev0vring1@9884000
      - vdev0vring0@9880000
      - rproc0@9800000
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          host: APU_Linux
          mbox: ipi_1_to_ipi_7
          carveouts: [ vdev0vring0@9880000, vdev0vring1@9884000, vdev0buffer@9888000 ]
          timer: ttc3

  R5_1_BAREMETAL:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_r5_1
        cpumask: 0x1
        mode:
          secure: true
          el: 0x3
    os,type: baremetal
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      libmetal-relation:
        compatible: libmetal,ipc-v1
        relation0:
          host: APU_Linux
          carveouts: [ libmetal_uio_desc0@99c8000, libmetal_uio_desc1@99cc000, libmetal_uio_data@99d0000 ]
          mbox: ipi_2_to_ipi_8 #IPI2 Libmetal example app (RPU)
          timer: ttc2
          elfload: [ libmetal_elf@9968000 ]

    sram:
      - dev: libmetal_elf@9968000
        start: 0x9968000
        size: 0x60000
      - dev: psu_r5_1_atcm_global@ffe90000
        size: 64K
        start: 0xffe90000
