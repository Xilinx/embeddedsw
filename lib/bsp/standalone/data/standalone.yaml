%YAML 1.2
---
title: Bindings for standalone

maintainers:
  - Mubin Sayyed <mubin.sayyed@amd.com>

type: os

version: 9.0

supported_processors:
  - cortexa78
  - psx_cortexa78
  - psv_cortexa72
  - psu_cortexa53
  - ps7_cortexa9
  - cortexr52
  - psx_cortexr52
  - psv_cortexr5
  - psu_cortexr5
  - pmc
  - psx_pmc
  - psv_pmc
  - psx_psm
  - psv_psm
  - psu_pmu
  - asu
  - microblaze
  - microblaze_riscv

depends:
    uartlite:
        - reg
    uartns550:
        - reg
    uartps:
        - reg
    uartpsv:
        - reg
    coresightps_dcc:
        - reg
    iomodule:
        - reg

examples:
    xil_nested_interrupts_example.c:
        - reg
    xpm_counter_arm_example.c:
        - reg
    riscv_modeswitch_guest.c:
        - reg
    riscv_modeswitch_monitor.c:
        - reg

...
